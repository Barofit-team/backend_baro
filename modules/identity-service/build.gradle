plugins {
	id 'java-test-fixtures'
}

// 회원·인증·사용자 프로필 도메인. 다른 도메인에 공개하는 것은 com.barofit.identity.api 패키지뿐이다(ArchUnit으로 검사)
dependencies {
	implementation project(':common')
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	// 바로핏 JWT 서명(NimbusJwtEncoder), 소셜 ID Token 검증(NimbusJwtDecoder)
	implementation 'org.springframework.security:spring-security-oauth2-jose'

	// 테스트용 키를 메모리에서 생성해 파일로 쓴다. app 통합 테스트도 사용한다
	testFixturesImplementation 'org.springframework.security:spring-security-oauth2-jose'

	// DB가 필요 없는 단위 테스트만 둔다. DB 통합 테스트는 app 모듈에 있다
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
}
