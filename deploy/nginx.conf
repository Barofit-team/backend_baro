server {
    listen 8080;
    server_name _;
    # Docker DNS를 다시 조회하므로 서비스 재생성 뒤에도 새 컨테이너로 연결한다.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $identity http://identity-service:8080;
    set $routine http://routine-service:8080;
    set $workout http://workout-service:8080;
    set $analytics http://analytics-service:8080;
    set $report http://report-service:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    # 프로필 사진 업로드(5MB) + multipart 여유. 기본값 1m이면 413
    client_max_body_size 6m;
    error_page 413 @content_too_large;
    location @content_too_large {
        default_type application/problem+json;
        return 413 '{"type":"about:blank","title":"Content Too Large","status":413,"detail":"프로필 사진은 5MB 이하만 올릴 수 있습니다.","code":"PROFILE_IMAGE_TOO_LARGE"}';
    }
    location = /health { default_type application/json; return 200 '{"status":"UP"}'; }
    location = /identity/v3/api-docs { proxy_pass $identity/v3/api-docs; }
    location = /identity/actuator/health { proxy_pass $identity/actuator/health; }
    location ~ ^/(api/v1/(auth|users)(/|$)|\.well-known/jwks\.json$) {
        proxy_pass $identity$request_uri;
    }
    location /ws/coaching {
        proxy_pass $workout$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
    location /api/v1/workout-sessions {
        proxy_pass $workout$request_uri;
    }
    location = /workout/v3/api-docs { proxy_pass $workout/v3/api-docs; }
    location = /workout/actuator/health { proxy_pass $workout/actuator/health; }
    location ~ ^/api/v1/(workout-records|statistics|calendar)(/|$) {
        proxy_pass $analytics$request_uri;
    }
    location ~ ^/api/v1/reports(/|$) { proxy_pass $report$request_uri; }
    location = /report/v3/api-docs { proxy_pass $report/v3/api-docs; }
    location = /report/actuator/health { proxy_pass $report/actuator/health; }
    location = /analytics/v3/api-docs { proxy_pass $analytics/v3/api-docs; }
    location = /analytics/actuator/health { proxy_pass $analytics/actuator/health; }
    location / { proxy_pass $routine$request_uri; }
}
