spring:
  application:
    name: backend_baro
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/barofit}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway만 변경
      ddl-auto: validate
  servlet:
    multipart:
      # 프로필 사진 5MB(ProfileImageFile.MAX_SIZE). 요청 전체는 multipart 헤더만큼 여유를 둔다
      max-file-size: 5MB
      max-request-size: 6MB

barofit:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  jwt:
    # 키 파일은 커밋 금지(scripts/generate-jwt-keys.sh)
    private-key-path: ${JWT_PRIVATE_KEY_PATH:}
    public-jwks-path: ${JWT_PUBLIC_JWKS_PATH:}
    current-kid: ${JWT_CURRENT_KID:}
  profile-image:
    # temporary: S3 연동 전 임시 저장소(파일을 보관하지 않고 임시 URL만 반환), s3: 미구현
    storage: ${PROFILE_IMAGE_STORAGE:temporary}
    public-base-url: ${PROFILE_IMAGE_PUBLIC_BASE_URL:https://temp-storage.barofit.invalid}
    s3:
      bucket: ${PROFILE_IMAGE_S3_BUCKET:}
      region: ${PROFILE_IMAGE_S3_REGION:}
  social:
    # 허용 redirect_uri. 콘솔 등록값과 같아야 함
    redirect-uris: ${SOCIAL_REDIRECT_URIS:http://localhost:8081}
    # aud 허용 목록(쉼표 구분). 교환용 client-id는 자동 허용
    google:
      jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
      audiences: ${GOOGLE_CLIENT_IDS:}
      token-uri: https://oauth2.googleapis.com/token
      client-id: ${GOOGLE_WEB_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
    kakao:
      jwk-set-uri: https://kauth.kakao.com/.well-known/jwks.json
      audiences: ${KAKAO_APP_KEYS:}
      token-uri: https://kauth.kakao.com/oauth/token
      client-id: ${KAKAO_REST_API_KEY:}
      client-secret: ${KAKAO_CLIENT_SECRET:}

server:
  port: ${PORT:3002}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
