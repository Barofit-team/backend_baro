spring:
  application:
    name: backend_baro
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/barofit}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway만 변경한다
      ddl-auto: validate

barofit:
  jwt:
    # 키 파일은 저장소에 커밋하지 않는다. 로컬은 scripts/generate-jwt-keys.sh로 생성한다
    private-key-path: ${JWT_PRIVATE_KEY_PATH:}
    public-jwks-path: ${JWT_PUBLIC_JWKS_PATH:}
    current-kid: ${JWT_CURRENT_KID:}
  social:
    # aud 허용 목록이 비어 있는 provider는 모든 ID Token을 거부한다. 여러 값은 쉼표로 구분한다
    google:
      jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
      audiences: ${GOOGLE_CLIENT_IDS:}
    kakao:
      jwk-set-uri: https://kauth.kakao.com/.well-known/jwks.json
      audiences: ${KAKAO_APP_KEYS:}

server:
  port: ${PORT:3002}
