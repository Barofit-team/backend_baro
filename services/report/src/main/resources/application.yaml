spring:
  application:
    name: report-service
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${REPORT_DB_URL:jdbc:postgresql://localhost:5432/barofit?currentSchema=report}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: false
barofit:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  jwt:
    public-jwks-path: ${JWT_PUBLIC_JWKS_PATH:}
  workout:
    base-url: ${WORKOUT_BASE_URL:http://localhost:3006}
  routine:
    base-url: ${ROUTINE_BASE_URL:http://localhost:3005}
server:
  port: ${REPORT_PORT:3008}
