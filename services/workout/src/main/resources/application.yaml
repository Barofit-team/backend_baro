spring:
  application:
    name: workout-service
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/barofit}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
barofit:
  identity:
    base-url: ${IDENTITY_BASE_URL:http://localhost:3004}
  routine:
    base-url: ${ROUTINE_BASE_URL:http://localhost:3005}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  jwt:
    public-jwks-path: ${JWT_PUBLIC_JWKS_PATH:}
  elevenlabs:
    api-key: ${ELEVENLABS_API_KEY:}
    voice-id: ${ELEVENLABS_VOICE_ID:}
    model-id: ${ELEVENLABS_MODEL_ID:eleven_multilingual_v2}
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-6-luna}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com}
  analytics:
    base-url: ${ANALYTICS_BASE_URL:http://localhost:3007}
    internal-token: ${ANALYTICS_INTERNAL_TOKEN:}
server:
  port: ${WORKOUT_PORT:3006}
