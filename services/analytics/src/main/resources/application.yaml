spring:
  application:
    name: analytics-service
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/barofit}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration/analytics

barofit:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  jwt:
    public-jwks-path: ${JWT_PUBLIC_JWKS_PATH:}

server:
  port: ${ANALYTICS_PORT:3006}