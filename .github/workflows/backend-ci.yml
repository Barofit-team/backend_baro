name: BaroFit Backend CI

on:
  push:
    branches:
      - dev
      - 'feat/**'
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Java 21 Gradle Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: barofit_analytics_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d barofit_analytics_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Docker
        run: docker info

      - name: Initialize Analytics test database
        run: |
          docker run --rm --network host \
            -v "$PWD/services/analytics/src/main/resources/db/migration/analytics/V1__create_analytics_tables.sql:/schema.sql:ro" \
            -e PGPASSWORD=postgres \
            postgres:17 \
            psql -h 127.0.0.1 -p 5432 \
              -U postgres \
              -d barofit_analytics_test \
              -v ON_ERROR_STOP=1 \
              -f /schema.sql

      - name: Grant Gradle permission
        run: chmod +x ./gradlew

      - name: Build and test
        run: ./gradlew build --no-daemon --console=plain

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
