# helm upgrade --install barofit infra/umbrella -n barofit --set global.imageTag=<TAG> --set global.dockerhubUser=<hub-user>
global:
  imageTag: ""
  # 서비스별 image.repository를 아래에서 직접 쓰거나, --set global.dockerhubUser=<user>로 한 번에 지정 가능하게
  # 각 서비스 블록의 repository를 "" 로 두면 build-and-push.sh가 쓴 값과 맞춰 --set으로 덮어써도 됨.

identity:
  image:
    repository: ""   # 예: docker.io/<hub-user>/barofit-identity

routine:
  image:
    repository: ""   # 예: docker.io/<hub-user>/barofit-routine

workout:
  image:
    repository: ""   # 예: docker.io/<hub-user>/barofit-workout

analytics:
  image:
    repository: ""   # 예: docker.io/<hub-user>/barofit-analytics

report:
  image:
    repository: ""   # 예: docker.io/<hub-user>/barofit-report

# postgres, gateway는 공용 공개 이미지(postgres:18.6, nginx:1.28-alpine)를 그대로 쓰므로
# repository 오버라이드가 필요 없음 (각 차트 자체 values.yaml 기본값 사용).
