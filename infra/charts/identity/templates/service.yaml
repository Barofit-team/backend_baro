apiVersion: v1
kind: Service
metadata:
  name: {{ include "identity.name" . }}
  labels:
    {{- include "identity.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "identity.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
