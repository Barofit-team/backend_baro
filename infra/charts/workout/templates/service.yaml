apiVersion: v1
kind: Service
metadata:
  name: {{ include "workout.name" . }}
  labels:
    {{- include "workout.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "workout.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
