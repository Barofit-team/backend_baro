nameOverride: postgres

image:
  repository: postgres
  tag: "18.6"
  pullPolicy: IfNotPresent

service:
  port: 5432

database: barofit

secrets:
  credentialsSecretName: barofit-postgres-credentials

persistence:
  size: 2Gi
  storageClassName: ""

resources:
  requests:
    cpu: 250m
    memory: 192Mi
  limits:
    cpu: 500m
    memory: 256Mi
