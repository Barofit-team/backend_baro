apiVersion: v1
kind: Service
metadata:
  name: {{ include "report.name" . }}
  labels:
    {{- include "report.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "report.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
