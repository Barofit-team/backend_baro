x-service: &service
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped

x-database: &database
  DB_URL: jdbc:postgresql://postgres:5432/barofit
  DB_USERNAME: ${DB_USERNAME:-postgres}
  DB_PASSWORD: ${DB_PASSWORD:-postgres}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: barofit
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  identity-service:
    <<: *service
    build:
      context: .
      args:
        SERVICE_NAME: identity
    environment:
      <<: *database
      IDENTITY_PORT: 8080
      JWT_PRIVATE_KEY_PATH: /app/secrets/jwt-private.pem
      JWT_PUBLIC_JWKS_PATH: /app/secrets/jwt-jwks.json
      JWT_CURRENT_KID: ${JWT_CURRENT_KID:-}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      KAKAO_APP_KEYS: ${KAKAO_APP_KEYS:-}
      SOCIAL_REDIRECT_URIS: ${SOCIAL_REDIRECT_URIS:-http://localhost:8081}
      GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      PROFILE_IMAGE_STORAGE: ${PROFILE_IMAGE_STORAGE:-temporary}
      PROFILE_IMAGE_PUBLIC_BASE_URL: ${PROFILE_IMAGE_PUBLIC_BASE_URL:-https://temp-storage.barofit.invalid}
      # storage=s3일 때. 자격 증명은 EC2 인스턴스 프로파일(IMDSv2 hop limit 2 이상) 또는 AWS_* 환경 변수
      PROFILE_IMAGE_S3_BUCKET: ${PROFILE_IMAGE_S3_BUCKET:-}
      PROFILE_IMAGE_S3_REGION: ${PROFILE_IMAGE_S3_REGION:-}
    volumes:
      - ./keys:/run/secrets/jwt:ro
    ports:
      - "127.0.0.1:${IDENTITY_PORT:-3004}:8080"

  routine-service:
    <<: *service
    build:
      context: .
      args:
        SERVICE_NAME: routine
    environment:
      <<: *database
      ROUTINE_PORT: 8080
      IDENTITY_BASE_URL: http://identity-service:8080
      WORKOUT_BASE_URL: http://workout-service:8080
      JWT_PUBLIC_JWKS_PATH: /app/secrets/jwt-jwks.json
    volumes:
      # 서명용 개인 키와 OAuth secret은 루틴에 전달하지 않는다.
      - ./keys/jwt-jwks.json:/run/secrets/jwt/jwt-jwks.json:ro
    ports:
      - "127.0.0.1:${ROUTINE_PORT:-3005}:8080"

  workout-service:
    <<: *service
    build:
      context: .
      args:
        SERVICE_NAME: workout
    environment:
      <<: *database
      WORKOUT_PORT: 8080
      IDENTITY_BASE_URL: http://identity-service:8080
      ROUTINE_BASE_URL: http://routine-service:8080
      JWT_PUBLIC_JWKS_PATH: /app/secrets/jwt-jwks.json
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
      ELEVENLABS_MODEL_ID: ${ELEVENLABS_MODEL_ID:-eleven_multilingual_v2}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
      ANALYTICS_BASE_URL: http://analytics-service:8080
      ANALYTICS_INTERNAL_TOKEN: ${ANALYTICS_INTERNAL_TOKEN:-}
    volumes:
      - ./keys/jwt-jwks.json:/run/secrets/jwt/jwt-jwks.json:ro
    ports:
      - "127.0.0.1:${WORKOUT_PORT:-3006}:8080"

  analytics-service:
    <<: *service
    build:
      context: .
      args:
        SERVICE_NAME: analytics
    environment:
      <<: *database
      ANALYTICS_DB_URL: jdbc:postgresql://postgres:5432/barofit?currentSchema=analytics
      ANALYTICS_PORT: 8080
      WORKOUT_BASE_URL: http://workout-service:8080
      ANALYTICS_INTERNAL_TOKEN: ${ANALYTICS_INTERNAL_TOKEN:-}
      JWT_PUBLIC_JWKS_PATH: /app/secrets/jwt-jwks.json
    volumes:
      - ./keys/jwt-jwks.json:/run/secrets/jwt/jwt-jwks.json:ro
    ports:
      - "127.0.0.1:${ANALYTICS_PORT:-3007}:8080"

  report-service:
    <<: *service
    build:
      context: .
      args:
        SERVICE_NAME: report
    environment:
      <<: *database
      REPORT_DB_URL: jdbc:postgresql://postgres:5432/barofit?currentSchema=report
      REPORT_PORT: 8080
      WORKOUT_BASE_URL: http://workout-service:8080
      ROUTINE_BASE_URL: http://routine-service:8080
      JWT_PUBLIC_JWKS_PATH: /app/secrets/jwt-jwks.json
    volumes:
      - ./keys/jwt-jwks.json:/run/secrets/jwt/jwt-jwks.json:ro
    ports:
      - "127.0.0.1:${REPORT_PORT:-3008}:8080"

  gateway:
    image: nginx:1.28-alpine
    depends_on:
      - identity-service
      - routine-service
      - workout-service
      - analytics-service
      - report-service
    restart: unless-stopped
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${PORT:-3002}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
