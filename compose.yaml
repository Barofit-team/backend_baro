services:
  postgres:
    # 테스트도 이 이미지를 쓴다
    image: postgres:18.6
    environment:
      POSTGRES_DB: barofit
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      # postgres 18부터 상위 경로 마운트
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/barofit
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt/jwt-private.pem
      JWT_PUBLIC_JWKS_PATH: /run/secrets/jwt/jwt-jwks.json
      JWT_CURRENT_KID: ${JWT_CURRENT_KID:-}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      KAKAO_APP_KEYS: ${KAKAO_APP_KEYS:-}
      SOCIAL_REDIRECT_URIS: ${SOCIAL_REDIRECT_URIS:-http://localhost:8081}
      GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
    volumes:
      # 키는 읽기 전용 마운트
      - ./keys:/run/secrets/jwt:ro
    ports:
      - "${PORT:-3002}:3002"

volumes:
  postgres-data:
