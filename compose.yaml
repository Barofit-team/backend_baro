services:
  postgres:
    # 테스트(Testcontainers)도 이 image 값을 그대로 사용한다. 태그를 바꿀 때는 여기만 수정한다
    image: postgres:18.6
    environment:
      POSTGRES_DB: barofit
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      # postgres 18 이미지부터 데이터 디렉터리의 상위 경로를 마운트한다
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/barofit
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt/jwt-private.pem
      JWT_PUBLIC_JWKS_PATH: /run/secrets/jwt/jwt-jwks.json
      JWT_CURRENT_KID: ${JWT_CURRENT_KID:-}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      KAKAO_APP_KEYS: ${KAKAO_APP_KEYS:-}
    volumes:
      # 이미지에 키를 넣지 않고 실행 시 읽기 전용으로 마운트한다
      - ./keys:/run/secrets/jwt:ro
    ports:
      - "${PORT:-3002}:3002"

volumes:
  postgres-data:
