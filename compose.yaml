x-service: &service
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped

x-database: &database
  DB_URL: jdbc:postgresql://postgres:5432/barofit
  DB_USERNAME: ${DB_USERNAME:-postgres}
  DB_PASSWORD: ${DB_PASSWORD:-postgres}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: barofit
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  identity-service:
    <<: *service
    build:
      context: .
      args:
        SERVICE_NAME: identity
    environment:
      <<: *database
      IDENTITY_PORT: 8080
      JWT_PRIVATE_KEY_PATH: /app/secrets/jwt-private.pem
      JWT_PUBLIC_JWKS_PATH: /app/secrets/jwt-jwks.json
      JWT_CURRENT_KID: ${JWT_CURRENT_KID:-}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      KAKAO_APP_KEYS: ${KAKAO_APP_KEYS:-}
      SOCIAL_REDIRECT_URIS: ${SOCIAL_REDIRECT_URIS:-http://localhost:8081}
      GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      PROFILE_IMAGE_STORAGE: ${PROFILE_IMAGE_STORAGE:-temporary}
      PROFILE_IMAGE_PUBLIC_BASE_URL: ${PROFILE_IMAGE_PUBLIC_BASE_URL:-https://temp-storage.barofit.invalid}
    volumes:
      - ./keys:/run/secrets/jwt:ro
    ports:
      - "127.0.0.1:${IDENTITY_PORT:-3004}:8080"

  routine-service:
    <<: *service
    build:
      context: .
      args:
        SERVICE_NAME: routine
    environment:
      <<: *database
      ROUTINE_PORT: 8080
      JWT_PUBLIC_JWKS_PATH: /app/secrets/jwt-jwks.json
    volumes:
      # 서명용 개인 키와 OAuth secret은 루틴에 전달하지 않는다.
      - ./keys/jwt-jwks.json:/run/secrets/jwt/jwt-jwks.json:ro
    ports:
      - "127.0.0.1:${ROUTINE_PORT:-3005}:8080"

  gateway:
    image: nginx:1.28-alpine
    depends_on:
      - identity-service
      - routine-service
    restart: unless-stopped
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${PORT:-3002}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
